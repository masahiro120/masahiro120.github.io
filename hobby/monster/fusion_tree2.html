      </div>

      <button id="run" onclick="main()" disabled

        検索する
      </button>

    let monsters = {};

    document.querySelectorAll('input[name="formula"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const isTarget = document.getElementById("target").checked;
        document.getElementById("target-form").classList.toggle("hidden", !isTarget);
        document.getElementById("func_type").value = isTarget ? "target" : "all";
      });
    });

    async function loadMonsters() {
      const ranks = ["F", "E", "D", "C", "B", "A", "S", "SS"];
      const result = {};

      for (const rank of ranks) {
        const res = await fetch(`./monsters_list/${rank}_rank.csv`);
        const text = await res.text();

        const lines = text.trim().split("\n");
        const headers = lines[0].split(",");

        for (const line of lines.slice(1)) {
          const cols = line.split(",");
          const row = {};

          headers.forEach((h, i) => {
            row[h] = cols[i] ? cols[i].trim() : null;
          });

          row["ランク"] = rank;
          result[row["モンスター名"]] = row;
        }
      }

      return result;
    }

    function renderMonsterCard(title, treeHtml) {
      return `
        <div class="bg-white rounded-2xl shadow p-5 border">
          <h2 class="text-xl font-bold text-gray-700 mb-4">
            ${title}
          </h2>

          <div class="text-gray-700">
            ${treeHtml}
          </div>
        </div>
      `;
    }

    function renderLeavesCard(leaves) {
      return `
        <div class="bg-white rounded-2xl shadow p-5 border">
          <h2 class="text-xl font-bold text-gray-700 mb-4">
            必要素材一覧
          </h2>

          <div class="flex flex-wrap gap-2">
            ${leaves.map(leaf => `
              <span class="px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-sm border">
                ${leaf.name}
              </span>
            `).join("")}
          </div>
        </div>
      `;
    }

    function buildTree(name) {
      if (!monsters[name]) {
        return {
          name: `${name}（データなし）`,
          children: []
        };
      }

      const info = monsters[name];
      const rank = info["ランク"] || "";
      const no = info["No"] || "";

      let label = name;
      if (rank || no) {
        label += ` [${rank}${no ? " " + no : ""}]`;
      }

      if (info["入手方法"]) {
        label += info["所持"] === "T"
          ? ` ── ${info["入手方法"]}（所持済）`
          : ` ── ${info["入手方法"]}`;

        return { name: label, children: [] };
      }

      if (info["所持"] === "T") {
        return { name: `${label} ── 所持済`, children: [] };
      }

      if (info["他国"] === "入手可") {
        return { name: `${label} ── 他国`, children: [] };
      }

      return {
        name: label,
        children: [1, 2, 3, 4]
          .map(i => info[`配合${i}`])
          .filter(Boolean)
          .map(child => buildTree(child))
      };
    }

    function renderTree(node, prefix = "", isLast = true, isRoot = true) {
      let result = "";

      if (isRoot) {
        result += `${node.name}\n`;
      } else {
        result += `${prefix}${isLast ? "└── " : "├── "}${node.name}\n`;
      }

      const childPrefix = isRoot
        ? ""
        : prefix + (isLast ? "    " : "│   ");

      node.children.forEach((child, index) => {
        const last = index === node.children.length - 1;
        result += renderTree(child, childPrefix, last, false);
      });

      return result;
    }

    function collectLeaves(node, leaves = []) {
      if (!node.children.length) {
        leaves.push(node);
        return leaves;
      }

      node.children.forEach(child => collectLeaves(child, leaves));
      return leaves;
    }

    function extractRank(name) {
      const match = name.match(/\[(.*?)\]/);
      return match ? match[1] : null;
    }

    function renderTreeHtml(node) {
      return `
        <ul class="ml-4 border-l border-gray-300 pl-4 space-y-2">
          <li>
            <div class="relative">
              <span class="absolute -left-6 top-3 w-4 border-t border-gray-300"></span>
              <span class="inline-block bg-gray-50 px-3 py-1 rounded-lg border text-sm">
                ${node.name}
              </span>
            </div>

            ${node.children.length
              ? node.children.map(child => renderTreeHtml(child)).join("")
              : ""
            }
          </li>
        </ul>
      `;
    }

    async function init() {
      monsters = await loadMonsters();
      document.getElementById("run").disabled = false;
    }

    async function main() {
      const output = document.getElementById("output");
      output.innerHTML = "";
      output.classList.add("hidden");

      const funcType = document.getElementById("func_type").value;
      const target = document.getElementById("input_monster_name").value.trim();

      if (funcType === "target" && !target) {
        output.innerHTML = `
      <div class="bg-red-50 text-red-600 border border-red-200 rounded-xl p-4">
        モンスター名を入力してください
      </div>
    `;
        output.classList.remove("hidden");
        return;
      }

      let html = "";

      if (funcType === "target") {
        const matchedNames = Object.keys(monsters)
          .filter(name => name.includes(target))
          .sort((a, b) => a.localeCompare(b, "ja"));

        if (!matchedNames.length) {
          output.innerHTML = `
        <div class="bg-yellow-50 text-yellow-700 border border-yellow-200 rounded-xl p-4">
          該当するモンスターが見つかりません
        </div>
      `;
          output.classList.remove("hidden");
          return;
        }

        const allLeaves = [];

        for (const name of matchedNames) {
          const tree = buildTree(name);

html += renderMonsterCard(
  `${name} の配合ツリー`,
  renderTreeHtml(tree)
);

          collectLeaves(tree, allLeaves);
        }

        const rankOrder = {
          "SS": 1,
          "S": 2,
          "A": 3,
          "B": 4,
          "C": 5,
          "D": 6,
          "E": 7,
          "F": 8
        };

        const uniqueLeaves = [...new Map(
          allLeaves.map(node => [node.name, node])
        ).values()];

        uniqueLeaves.sort((a, b) => {
          const ra = rankOrder[extractRank(a.name)] || 99;
          const rb = rankOrder[extractRank(b.name)] || 99;
          return ra - rb || a.name.localeCompare(b.name, "ja");
        });

        html += renderLeavesCard(uniqueLeaves);

      } else {
        const targets = Object.entries(monsters)
          .filter(([_, info]) => info["所持"] !== "T" && info["ランク"] === "SS")
          .map(([name]) => name)
          .sort((a, b) => a.localeCompare(b, "ja"));

        if (!targets.length) {
          output.innerHTML = `
        <div class="bg-green-50 text-green-700 border border-green-200 rounded-xl p-4">
          未所持モンスターはありません
        </div>
      `;
          output.classList.remove("hidden");
          return;
        }

        const allLeaves = [];

        for (const name of targets) {
          const tree = buildTree(name);

          html += renderMonsterCard(
            `${name} の配合ツリー`,
            renderTree(tree)
          );

          collectLeaves(tree, allLeaves);
        }

        const uniqueLeaves = [...new Map(
          allLeaves.map(node => [node.name, node])
        ).values()];

        uniqueLeaves.sort((a, b) => {
          const getMethod = (name) => {
            const pureName = name.split(" [")[0];
            return monsters[pureName]?.["入手方法"] || "";
          };

          const methodA = getMethod(a.name);
          const methodB = getMethod(b.name);

          if (methodA !== methodB) {
            return methodA.localeCompare(methodB, "ja");
          }

          return a.name.localeCompare(b.name, "ja");
        });

        html += renderLeavesCard(uniqueLeaves);
      }

      output.innerHTML = html;
      output.classList.remove("hidden");
    }

    init();

    document.querySelectorAll("input").forEach(el => {
      el.addEventListener("change", () => el.blur());

      el.addEventListener("keydown", e => {
        if (e.key === "Enter") el.blur();
      });
    });

    document.addEventListener("pointerdown", e => {
      if (!e.target.closest("input")) {
        document.activeElement?.blur();
      }
    });
