<!DOCTYPE html>
<html lang="ja" data-theme="night">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/icon.png">
  <title>税金</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/site.css">
</head>

<body class="page-shell">

  <div class="main-container">
    <div class="page-card">
      <div class="card-body">

        <div class="section-title">
          <h1 class="hero-title" style="font-size: 2.5rem;">税金</h1>
          <a href="/index.html" class="back-button">← 戻る</a>
        </div>

        <div class="space-y-6">

      <!-- ラジオ -->
			<div class="flex flex-col md:flex-row gap-3 text-sm md:text-base">
				<label><input type="radio" name="mode" value="before2027" checked> 2026年</label>
				<label><input type="radio" name="mode" value="after2027"> 2027年以降</label>
			</div>

      <!-- ラジオ -->
			<div class="flex flex-col md:flex-row gap-3 text-sm md:text-base">
				<label><input type="radio" name="resident" value="yokohama" checked> 横浜市</label>
			</div>

      <!-- 入力 -->
      <div>
        <label class="block text-lg font-semibold mb-2 text-slate-200">
          年収（万円）
        </label>
        <input type="number" id="input_income"
          class="w-full text-xl p-3 border rounded-lg bg-white text-black focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="例：500">
      </div>

      <!-- ボタン -->
      <button onclick="main()"
        class="w-full btn-scale bg-blue-500 text-white py-3 rounded-lg text-lg font-semibold hover:bg-blue-600 transition">
        計算
      </button>

      <!-- 出力 -->
      <div id="output1" class="hidden bg-gray-50 p-6 rounded-xl border space-y-4"></div>
      <div id="output2" class="hidden bg-gray-50 p-6 rounded-xl border space-y-4"></div>
      <div id="output3" class="hidden bg-gray-50 p-6 rounded-xl border space-y-4"></div>

        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      formatNumber,
      tomonth,
      formatYen
    } from "/module.js";

    import {
      calcEmploymentIncomeDeduction,
      calcBasicDeduction,
      calcBasicDeduction2027,
      calcIncomeTax,
      calcInsurance,
      calcResidentTax
    } from "./module.js";

    window.main = function () {
      const output1 = document.getElementById("output1");
      output1.classList.remove("hidden");

      const output2 = document.getElementById("output2");
      output2.classList.remove("hidden");

      const output3 = document.getElementById("output3");
      output3.classList.remove("hidden");

      const input_income = Number(document.getElementById("input_income").value);

      if (!input_income || isNaN(input_income)) {
        output1.innerHTML = `
          <div class="text-red-500 text-center font-bold">
            入力を確認してください
          </div>
        `;

        document.getElementById("output2").classList.add("hidden");
        document.getElementById("output3").classList.add("hidden");

        return;
      }

      let income = input_income;

      const insurance = calcInsurance(income, 5.5);

      const employment = calcEmploymentIncomeDeduction(income);
      income = Math.max(0, income - employment);

      const basic = document.querySelector('input[name="mode"]:checked').value === "before2027"
      ? calcBasicDeduction(income)
      : calcBasicDeduction2027(income);

      income = Math.max(0, income - basic);
      income = Math.max(0, income - insurance.total);

      const tax = calcIncomeTax(income);

      // 辞書形式でyokohamaがキー
      const resident_dict = {
        yokohama: { rate: 0.1, perCapita: 0.5 }
      };

      const resident = calcResidentTax(
                        income,
                        resident_dict[document.querySelector('input[name="resident"]:checked').value].rate,
                        resident_dict[document.querySelector('input[name="resident"]:checked').value].perCapita
                      );

      output1.innerHTML = `
        <h2 class="text-2xl font-bold mb-3 text-center text-gray-500">控除</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="text-gray-500">給与所得控除</div>
            <div class="text-2xl font-bold text-blue-600">${formatNumber(employment)} 万円</div>
          </div>

          <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="text-gray-500">基礎控除</div>
            <div class="text-2xl font-bold text-blue-600">${formatNumber(basic)} 万円</div>
          </div>

          <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="text-gray-500">課税所得</div>
            <div class="text-2xl font-bold text-blue-600">${formatNumber(income)} 万円</div>
          </div>
        </div>
      `;

      output2.innerHTML = `
        <h2 class="text-2xl font-bold mb-3 text-center text-gray-500">社会保険料(内訳)</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="text-gray-500">健康保険料</div>
            <div class="text-2xl font-bold text-green-600">${formatNumber(insurance.health)} 万円</div>
            <div class="text-sm text-gray-400 mt-1">${formatYen(tomonth(insurance.health))} 円/月</div>
          </div>

          <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="text-gray-500">厚生年金</div>
            <div class="text-2xl font-bold text-green-600">${formatNumber(insurance.pension)} 万円</div>
            <div class="text-sm text-gray-400 mt-1">${formatYen(tomonth(insurance.pension))} 円/月</div>
          </div>

          <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="text-gray-500">雇用保険料</div>
            <div class="text-2xl font-bold text-green-600">${formatNumber(insurance.employment)} 万円</div>
            <div class="text-sm text-gray-400 mt-1">${formatYen(tomonth(insurance.employment))} 円/月</div>
          </div>
        </div>
      `;

      output3.innerHTML = `
        <h2 class="text-2xl font-bold mb-3 text-center text-gray-500">税金</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

          <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="text-gray-500">所得税</div>

            <div class="text-2xl font-bold text-green-600">${formatNumber(tax)} 万円</div>
            <div class="text-sm text-gray-400 mt-1">${formatYen(tomonth(tax))} 円/月</div>
          </div>

          <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="text-gray-500">住民税</div>

            <div class="text-2xl font-bold text-green-600">${formatNumber(resident)} 万円</div>
            <div class="text-sm text-gray-400 mt-1">${formatYen(tomonth(resident))} 円/月</div>
          </div>

          <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="text-gray-500">社会保険料</div>

            <div class="text-2xl font-bold text-green-600">${formatNumber(insurance.total)} 万円</div>
            <div class="text-sm text-gray-400 mt-1">${formatYen(tomonth(insurance.total))} 円/月</div>
          </div>

        </div>
      `;
    };

    document.querySelectorAll("input").forEach(el => {
			el.addEventListener("change", () => {
				el.blur();
			});

			el.addEventListener("keydown", (e) => {
				if (e.key === "Enter") el.blur();
			});
		});

		document.addEventListener("pointerdown", (e) => {
			if (!e.target.closest("input")) {
				document.activeElement?.blur();
			}
		});
  </script>

</body>

</html>
