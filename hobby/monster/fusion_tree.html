<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/icon.png">
  <title>テリワンSP 配合図検索</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen p-6">

  <!-- 戻る -->
  <a href="/index.html" class="fixed top-5 right-5 bg-white shadow px-4 py-2 rounded-lg hover:bg-gray-100">
    ← 戻る
  </a>

  <div class="max-w-4xl mx-auto">

    <!-- タイトル -->
    <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">
      テリワンSP 配合図検索
    </h1>

    <!-- カード -->
    <div class="bg-white rounded-2xl shadow-lg p-8 space-y-6">

      <!-- ラジオ -->
      <div class="flex justify-center gap-6 text-lg">
        <label class="flex items-center gap-2">
          <input type="radio" id="target" name="formula" value="target" checked>
          個別検索
        </label>
        <label class="flex items-center gap-2">
          <input type="radio" id="all" name="formula" value="all">
          未所持すべて表示
        </label>
      </div>

      <input type="hidden" id="func_type" value="target">

      <!-- 入力 -->
      <div id="target-form">
        <input type="text" id="input_monster_name" placeholder="モンスター名を入力"
          class="w-full p-3 text-lg border rounded-lg focus:ring-2 focus:ring-blue-400">
      </div>

      <!-- ボタン -->
      <button id="run" onclick="main()" disabled
        class="w-full bg-green-500 text-white py-3 rounded-lg text-lg hover:bg-green-600 disabled:bg-gray-400">
        検索する
      </button>

      <!-- 出力 -->
      <pre id="output" class="hidden bg-gray-100 p-4 rounded-lg border text-sm whitespace-pre overflow-x-auto"></pre>

    </div>
  </div>

  <script>
    let pyodide;

    // ラジオ切替
    document.querySelectorAll('input[name="formula"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const isTarget = document.getElementById("target").checked;
        document.getElementById("target-form").classList.toggle("hidden", !isTarget);
        document.getElementById("func_type").value = isTarget ? "target" : "all";
      });
    });

    async function loadPyodideAndPackages() {
      pyodide = await loadPyodide();
      await pyodide.loadPackage("micropip");
      await pyodide.runPythonAsync(`
import micropip
await micropip.install("anytree")
`);
      document.getElementById("run").disabled = false;
    }

    async function loadCsvInPyodide(filename, url) {
      const response = await fetch(url);
      const text = await response.text();
      pyodide.FS.writeFile(filename, text);
    }

    async function main() {
      const output = document.getElementById("output");
      output.innerText = "";
      output.classList.add("hidden");

      while (!pyodide) {
        await new Promise(resolve => setTimeout(resolve, 100));
      }

      let result = "";

      let func_type = document.getElementById("func_type").value;
      let input_monster_name = document.getElementById("input_monster_name").value;

      if (func_type === "target" && input_monster_name.trim() === "") {
        output.innerText = "モンスター名を入力してください";
        output.classList.remove("hidden");
        return;
      }

      try {
        const ranks = ["F", "E", "D", "C", "B", "A", "S", "SS"];
        for (let r of ranks) {
          await loadCsvInPyodide(`${r}_rank.csv`, `./monsters_list/${r}_rank.csv`);
        }

        const res = await fetch("py_program_v2.py");
        let code = res.ok
          ? `func_type='${func_type}'\ntarget='${input_monster_name}'\n` + await res.text()
          : "print('読み込みエラー')";

        pyodide.setStdout({ batched: (msg) => result += msg + "\n" });
        await pyodide.runPythonAsync(code);

      } catch (e) {
        result = "エラー: " + e;
      }

      output.innerText = result;
      output.classList.remove("hidden");
    }

    loadPyodideAndPackages();

    document.querySelectorAll("input").forEach(el => {
      el.addEventListener("change", () => {
        el.blur();
      });

      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") el.blur();
      });
    });

    document.addEventListener("pointerdown", (e) => {
      if (!e.target.closest("input")) {
        document.activeElement?.blur();
      }
    });
  </script>

</body>

</html>
