<!DOCTYPE html>
<html lang="ja" data-theme="night">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Tools</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white">

  <div class="max-w-5xl mx-auto p-6">

    <!-- Header -->
    <div class="text-center mb-10">
      <h1 class="text-5xl font-black tracking-tight mb-3">
        My Tools
      </h1>

      <p class="text-slate-400">
        Personal Dashboard
      </p>
    </div>

    <!-- Work -->
    <div class="card bg-white/10 backdrop-blur-xl border border-white/10 shadow-2xl mb-8">

      <div class="card-body">

        <h2 class="card-title text-2xl mb-4">
          <i class="fa-solid fa-briefcase"></i>
          Work
        </h2>

        <div class="grid md:grid-cols-2 gap-4">

          <a href="work/income_tax/income.html"
            class="btn btn-primary btn-lg hover:scale-[1.02] transition-all duration-300">
            <i class="fa-solid fa-yen-sign"></i>
            税金
          </a>

          <a href="work/rent/rent.html"
            class="btn btn-primary btn-lg hover:scale-[1.02] transition-all duration-300">
            <i class="fa-solid fa-house"></i>
            家賃
          </a>

        </div>
      </div>
    </div>

    <!-- Toggle -->
    <div class="text-center mb-8">

      <button id="toggle-btn"
        onclick="toggleHobby()"
        class="btn btn-secondary btn-wide">
        Hobbyを表示
      </button>

    </div>

    <!-- Hobby -->
    <div id="hobby-section"
      class="card bg-white/10 backdrop-blur-xl border border-white/10 shadow-2xl hidden">

      <div class="card-body">

        <h2 class="card-title text-2xl mb-4">
          <i class="fa-solid fa-gamepad"></i>
          Hobby
        </h2>

        <div class="grid md:grid-cols-3 gap-4">

          <a href="hobby/quadratic_function/quadratic.html"
            class="btn btn-accent btn-lg">
            二次関数
          </a>

          <a href="hobby/monster/fusion_tree.html"
            class="btn btn-accent btn-lg">
            ゲーム
          </a>

          <a href="hobby/training/training.html"
            class="btn btn-accent btn-lg">
            カロリー
          </a>

        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <dialog id="password-modal" class="modal">

    <div class="modal-box">

      <h3 class="font-bold text-lg mb-4">
        Password Required
      </h3>

      <input type="password"
        id="password-input"
        placeholder="password"
        class="input input-bordered w-full mb-4" />

      <div class="modal-action">

        <button onclick="submitPassword()" class="btn btn-primary">
          OK
        </button>

        <button onclick="closeModal()" class="btn">
          Cancel
        </button>

      </div>
    </div>
  </dialog>

  <script>
    let pendingAction = null;

    function toggleHobby() {
      const section = document.getElementById("hobby-section");

      if (section.classList.contains("hidden")) {
        openModal("show");
      } else {
        hideHobby();
      }
    }

    function openModal(action) {
      pendingAction = action;
      document.getElementById("password-modal").showModal();
    }

    function closeModal() {
      document.getElementById("password-modal").close();
    }

    function submitPassword() {
      const input = document.getElementById("password-input").value;

      if (input === "password") {
        showHobby();
        closeModal();
      } else {
        alert("パスワードが違います");
      }
    }

    function showHobby() {
      const section = document.getElementById("hobby-section");
      const btn = document.getElementById("toggle-btn");

      section.classList.remove("hidden");

      btn.textContent = "Hobbyを非表示";
      btn.classList.remove("btn-secondary");
      btn.classList.add("btn-error");
    }

    function hideHobby() {
      const section = document.getElementById("hobby-section");
      const btn = document.getElementById("toggle-btn");

      section.classList.add("hidden");

      btn.textContent = "Hobbyを表示";
      btn.classList.remove("btn-error");
      btn.classList.add("btn-secondary");
    }
  </script>

</body>

</html>
