<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/icon.png">
  <title>二次関数 最大最小値計算</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen p-6">

  <div class="max-w-2xl mx-auto">

    <!-- ヘッダー -->
    <div class="flex items-center mb-6">

      <h1 class="text-2xl md:text-3xl font-bold text-gray-800">
        二次関数 最大最小値計算
      </h1>

      <a href="/index.html" class="ml-auto bg-white shadow px-4 py-2 rounded-lg hover:bg-gray-100">
        ← 戻る
      </a>

    </div>

    <div class="bg-white p-6 rounded-2xl shadow space-y-4">

      <!-- ラジオ -->
      <div class="flex gap-4 justify-center">
        <label><input type="radio" name="type" value="abc" checked> y=ax²+bx+c</label>
        <label><input type="radio" name="type" value="apq"> y=a(x-p)²+q</label>
      </div>

      <!-- 入力 -->
      <div class="grid grid-cols-2 gap-3">
        <input id="a" type="number" placeholder="a" class="p-2 border rounded">
        <input id="b" type="number" placeholder="b" class="p-2 border rounded">
        <input id="c" type="number" placeholder="c" class="p-2 border rounded">
        <input id="p" type="number" placeholder="p" class="p-2 border rounded hidden">
        <input id="q" type="number" placeholder="q" class="p-2 border rounded hidden">
      </div>

      <!-- 範囲 -->
      <div class="flex gap-2 justify-center">
        <input id="min" type="number" placeholder="最小" class="p-2 border rounded w-24">
        <span>〜</span>
        <input id="max" type="number" placeholder="最大" class="p-2 border rounded w-24">
      </div>

      <!-- ボタン -->
      <button onclick="main()"
        class="w-full bg-blue-500 text-white py-3 rounded-lg text-lg font-semibold hover:bg-blue-600 transition">
        計算
      </button>

      <!-- 結果 -->
      <div id="output" class="hidden bg-gray-50 p-6 rounded-xl border space-y-4"></div>

      <!-- グラフ -->
      <!-- <canvas id="graph" width="400" height="300" class="hidden border rounded mx-auto block"></canvas> -->
      <canvas id="graph"
  class="hidden border rounded mx-auto block w-full max-auto"
></canvas>

    </div>
  </div>

  <script type="module">
    import {
      toFraction,
      formatQuadratic,
      fmt,
      formatPoints,
      convertToApq,
      createQuadratic,
      calcExtrema,
      normalizeInput,
      drawGraph
    } from "./module.js";

    document.querySelectorAll('input[name="type"]').forEach(r => {
      r.addEventListener("change", () => {
        const isABC = document.querySelector('input[name="type"]:checked').value === "abc";
        document.getElementById("b").classList.toggle("hidden", !isABC);
        document.getElementById("c").classList.toggle("hidden", !isABC);
        document.getElementById("p").classList.toggle("hidden", isABC);
        document.getElementById("q").classList.toggle("hidden", isABC);
        document.getElementById("output").classList.add("hidden");
        document.getElementById("graph").classList.add("hidden");
      });
    });

    window.main = function () {

      const type = document.querySelector('input[name="type"]:checked').value;

      let input = normalizeInput(
        document.getElementById("a").value,
        document.getElementById("b").value,
        document.getElementById("c").value,
        document.getElementById("p").value,
        document.getElementById("q").value
      );

      let min = Number(document.getElementById("min").value);
      let max = Number(document.getElementById("max").value);

      const output = document.getElementById("output");
      output.classList.remove("hidden");

      if (!input.a || isNaN(min) || isNaN(max) || min >= max) {
        document.getElementById("graph").classList.add("hidden");
        output.innerHTML = `
          <div class="text-red-500 text-center font-bold">
            入力を確認してください
          </div>
        `;
        return;
      }

      const { a, p: newP, q: newQ } = convertToApq(
        type,
        input.a,
        input.b,
        input.c,
        input.p,
        input.q
      );

      const { maxPoints, minPoints } = calcExtrema(a, newP, newQ, min, max);

      const funcStr = formatQuadratic(a, newP, newQ);

      output.innerHTML = `
        <div class="bg-white p-4 rounded-lg shadow text-center">
          <div class="text-2xl font-bold text-blue-600">${funcStr}</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-center text-center">
            <div class="text-gray-500">最大値</div>
            <div class="text-2xl font-bold text-blue-600">${formatPoints(maxPoints)}</div>
          </div>

          <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-center text-center">
            <div class="text-gray-500">最小値</div>
            <div class="text-2xl font-bold text-blue-600">${formatPoints(minPoints)}</div>
          </div>
        </div>
      `;

      drawGraph(a, newP, newQ, min, max, maxPoints, minPoints);
    }

    document.querySelectorAll("input").forEach(el => {
      el.addEventListener("change", () => {
        el.blur();
      });

      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") el.blur();
      });
    });

    document.addEventListener("pointerdown", (e) => {
      if (!e.target.closest("input")) {
        document.activeElement?.blur();
      }
    });
  </script>

</body>

</html>
