<!DOCTYPE html>
<html lang="ja" data-theme="night">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Tools</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/site.css">
</head>

<body class="page-shell">

  <div class="main-container">

    <!-- Header -->
    <div class="hero-header">
      <h1 class="hero-title">
        My Tools
      </h1>

      <p class="hero-subtitle">
        Personal Dashboard
      </p>
    </div>

    <!-- Work -->
    <div class="page-card">

      <div class="card-body">

        <h2 class="card-title text-2xl mb-4">
          <i class="fa-solid fa-briefcase"></i>
          Work
        </h2>

        <div class="grid-two-col">

          <a href="work/income_tax/income.html"
            class="btn btn-primary btn-lg hover:scale-[1.02] transition-all duration-300">
            <i class="fa-solid fa-yen-sign"></i>
            税金
          </a>

          <a href="work/rent/rent.html"
            class="btn btn-primary btn-lg btn-scale">
            <i class="fa-solid fa-house"></i>
            家賃
          </a>

          <a href="work/supabase/supabase_sleep.html"
            class="btn btn-primary btn-lg btn-scale">
            <i class="fa-solid fa-bed"></i>
            睡眠
          </a>

          <a href="work/orthodontics/orthodontics.html"
            class="btn btn-primary btn-lg btn-scale">
            <i class="fa-solid fa-tooth"></i>
            歯科矯正
          </a>

          <a href="work/savings/savings.html"
            class="btn btn-primary btn-lg btn-scale">
            <i class="fa-solid fa-piggy-bank"></i>
            貯金管理
          </a>

        </div>
      </div>
    </div>

    <!-- Toggle -->
    <div class="toggle-area">

      <button id="toggle-btn"
        onclick="toggleHobby()"
        class="btn btn-secondary btn-wide btn-scale">
        Hobbyを表示
      </button>

    </div>

    <!-- Hobby -->
    <div id="hobby-section"
      class="page-card hobby-card hidden">

      <div class="card-body">

        <h2 class="card-title text-2xl mb-4">
          <i class="fa-solid fa-gamepad"></i>
          Hobby
        </h2>

        <div class="grid md:grid-cols-3 gap-4">

          <a href="hobby/quadratic_function/quadratic.html"
            class="btn btn-accent btn-lg">
            二次関数
          </a>

          <a href="hobby/monster/fusion_tree.html"
            class="btn btn-accent btn-lg">
            ゲーム
          </a>

          <a href="hobby/training/training.html"
            class="btn btn-accent btn-lg">
            カロリー
          </a>

        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <dialog id="password-modal" class="modal">

    <div class="modal-box">

      <h3 class="font-bold text-lg mb-4">
        Password Required
      </h3>

      <input type="password"
        id="password-input"
        placeholder="password"
        class="input input-bordered w-full mb-4" />

      <div class="modal-action">

        <button onclick="submitPassword()" class="btn btn-primary">
          OK
        </button>

        <button onclick="closeModal()" class="btn">
          Cancel
        </button>

      </div>
    </div>
  </dialog>

  <script>
    let pendingAction = null;

    function toggleHobby() {
      const section = document.getElementById("hobby-section");

      if (section.classList.contains("hidden")) {
        openModal("show");
      } else {
        hideHobby();
      }
    }

    function openModal(action) {
      pendingAction = action;
      document.getElementById("password-modal").showModal();
    }

    function closeModal() {
      document.getElementById("password-modal").close();
    }

    function submitPassword() {
      const input = document.getElementById("password-input").value;

      if (input === "password") {
        showHobby();
        closeModal();
      } else {
        alert("パスワードが違います");
      }
    }

    function showHobby() {
      const section = document.getElementById("hobby-section");
      const btn = document.getElementById("toggle-btn");

      section.classList.remove("hidden");

      btn.textContent = "Hobbyを非表示";
      btn.classList.remove("btn-secondary");
      btn.classList.add("btn-error");
    }

    function hideHobby() {
      const section = document.getElementById("hobby-section");
      const btn = document.getElementById("toggle-btn");

      section.classList.add("hidden");

      btn.textContent = "Hobbyを表示";
      btn.classList.remove("btn-error");
      btn.classList.add("btn-secondary");
    }
  </script>

</body>

</html>
