<!DOCTYPE html>
<html lang="ja" data-theme="night">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/icon.png">
  <title>二次関数</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/site.css">
</head>

<body class="page-shell">

  <div class="main-container">
    <div class="page-card">
      <div class="card-body">

        <div class="section-title">
          <h1 class="hero-title" style="font-size: 2.5rem;">二次関数</h1>
          <a href="/index.html" class="back-button">戻る</a>
        </div>

        <div class="space-y-6">


      <!-- ラジオ -->
      <div class="flex gap-4 justify-center">
        <label><input type="radio" name="type" value="abc" checked> y=ax²+bx+c</label>
        <label><input type="radio" name="type" value="apq"> y=a(x-p)²+q</label>
      </div>

      <!-- 入力 -->
      <div class="grid grid-cols-2 gap-3">
        <input id="a" type="number" placeholder="a" class="p-2 border rounded bg-white text-black">
        <input id="b" type="number" placeholder="b" class="p-2 border rounded bg-white text-black">
        <input id="c" type="number" placeholder="c" class="p-2 border rounded bg-white text-black">
        <input id="p" type="number" placeholder="p" class="p-2 border rounded bg-white text-black hidden">
        <input id="q" type="number" placeholder="q" class="p-2 border rounded bg-white text-black hidden">
      </div>

      <!-- 範囲 -->
      <div class="flex gap-2 justify-center">
        <input id="min" type="number" placeholder="最小" class="p-2 border rounded bg-white text-black w-24">
        <span>〜</span>
        <input id="max" type="number" placeholder="最大" class="p-2 border rounded bg-white text-black w-24">
      </div>

      <!-- ボタン -->
      <button onclick="main()"
        class="w-full bg-blue-500 text-white py-3 rounded-lg text-lg font-semibold hover:bg-blue-600 transition">
        計算
      </button>

      <!-- 結果 -->
      <div id="output" class="hidden bg-gray-50 p-6 rounded-xl border space-y-4"></div>

      <!-- グラフ -->
      <!-- <canvas id="graph" width="400" height="300" class="hidden border rounded mx-auto block"></canvas> -->
      <canvas id="graph"
  class="hidden border rounded mx-auto block w-full max-auto"
></canvas>

        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      toFraction,
      formatQuadratic,
      fmt,
      formatPoints,
      convertToApq,
      createQuadratic,
      calcExtrema,
      normalizeInput,
      drawGraph
    } from "./module.js";

    document.querySelectorAll('input[name="type"]').forEach(r => {
      r.addEventListener("change", () => {
        const isABC = document.querySelector('input[name="type"]:checked').value === "abc";
        document.getElementById("b").classList.toggle("hidden", !isABC);
        document.getElementById("c").classList.toggle("hidden", !isABC);
        document.getElementById("p").classList.toggle("hidden", isABC);
        document.getElementById("q").classList.toggle("hidden", isABC);
        document.getElementById("output").classList.add("hidden");
        document.getElementById("graph").classList.add("hidden");
      });
    });

    window.main = function () {

      const type = document.querySelector('input[name="type"]:checked').value;

      let input = normalizeInput(
        document.getElementById("a").value,
        document.getElementById("b").value,
        document.getElementById("c").value,
        document.getElementById("p").value,
        document.getElementById("q").value
      );

      let min = Number(document.getElementById("min").value);
      let max = Number(document.getElementById("max").value);

      const output = document.getElementById("output");
      output.classList.remove("hidden");

      if (!input.a || isNaN(min) || isNaN(max) || min >= max) {
        document.getElementById("graph").classList.add("hidden");
        output.innerHTML = `
          <div class="text-red-500 text-center font-bold">
            入力を確認してください
          </div>
        `;
        return;
      }

      const { a, p: newP, q: newQ } = convertToApq(
        type,
        input.a,
        input.b,
        input.c,
        input.p,
        input.q
      );

      const { maxPoints, minPoints } = calcExtrema(a, newP, newQ, min, max);

      const funcStr = formatQuadratic(a, newP, newQ);

      output.innerHTML = `
        <div class="bg-white p-4 rounded-lg shadow text-center">
          <div class="text-2xl font-bold text-blue-600">${funcStr}</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-center text-center">
            <div class="text-gray-500">最大値</div>
            <div class="text-2xl font-bold text-blue-600">${formatPoints(maxPoints)}</div>
          </div>

          <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-center text-center">
            <div class="text-gray-500">最小値</div>
            <div class="text-2xl font-bold text-blue-600">${formatPoints(minPoints)}</div>
          </div>
        </div>
      `;

      drawGraph(a, newP, newQ, min, max, maxPoints, minPoints);
    }

    document.querySelectorAll("input").forEach(el => {
      el.addEventListener("change", () => {
        el.blur();
      });

      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") el.blur();
      });
    });

    document.addEventListener("pointerdown", (e) => {
      if (!e.target.closest("input")) {
        document.activeElement?.blur();
      }
    });
  </script>

</body>

</html>
