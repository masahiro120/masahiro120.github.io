<!DOCTYPE html>
<html lang="ja" data-theme="night">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/icon.png">
  <title>ダーツ相談チャット</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    .chat-light-control {
      background: #ffffff !important;
      color: #0f172a !important;
    }

    /* daisyUI の textarea は line-height: 2 で、iPhone ではカーソルが大きくなるため詰める */
    textarea.chat-light-control {
      font-size: 16px;
      line-height: 1.5;
    }

    .chat-log {
      max-height: 65vh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* Claude の答え（Markdown）の見た目 */
    .chat-answer {
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .chat-answer h1,
    .chat-answer h2,
    .chat-answer h3 {
      font-weight: 700;
      margin: 1em 0 0.4em;
    }

    .chat-answer h1 {
      font-size: 1.15rem;
    }

    .chat-answer h2 {
      font-size: 1.05rem;
    }

    .chat-answer h3 {
      font-size: 1rem;
    }

    .chat-answer p,
    .chat-answer ul,
    .chat-answer ol {
      margin: 0.5em 0;
    }

    .chat-answer ul {
      list-style: disc;
      padding-left: 1.4em;
    }

    .chat-answer ol {
      list-style: decimal;
      padding-left: 1.4em;
    }

    .chat-answer code {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 4px;
      padding: 0 0.3em;
    }

    .chat-answer pre {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 8px;
      padding: 0.75em;
      overflow-x: auto;
    }

    .chat-answer .table-wrap {
      overflow-x: auto;
      overscroll-behavior: none;
      margin: 0.6em 0;
    }

    .chat-answer table {
      border-collapse: collapse;
      font-size: 0.9em;
      white-space: nowrap;
    }

    .chat-answer th,
    .chat-answer td {
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 0.3em 0.6em;
    }

    .chat-answer th {
      background: rgba(148, 163, 184, 0.15);
    }
  </style>
</head>

<body class="page-shell">
  <div class="main-container">
    <div class="page-card">
      <div class="card-body space-y-5">
        <div class="section-title section-title-inline">
          <h1 class="hero-title" style="font-size: clamp(2rem, 7vw, 2.8rem);">ダーツ相談チャット</h1>
          <a href="darts.html" class="back-button back-button-inline">記録へ</a>
        </div>

        <div id="status" class="rounded-lg bg-slate-900/50 px-4 py-3 text-sm text-slate-200">読み込み中...</div>

        <!-- ログイン -->
        <div id="login-panel" class="hidden rounded-2xl border border-slate-700 bg-slate-900/60 p-4 space-y-3">
          <h2 class="text-lg font-bold text-white">ログイン</h2>
          <p class="text-sm text-slate-300">このチャットは、登録したアカウントだけが使えます。</p>
          <div class="grid gap-3 sm:grid-cols-2">
            <div>
              <label for="email" class="mb-1 block text-xs font-semibold text-slate-300">メールアドレス</label>
              <input id="email" type="email" autocomplete="username" class="chat-light-control input input-bordered w-full" />
            </div>
            <div>
              <label for="password" class="mb-1 block text-xs font-semibold text-slate-300">パスワード</label>
              <input id="password" type="password" autocomplete="current-password" class="chat-light-control input input-bordered w-full" />
            </div>
          </div>
          <button id="login-btn" class="w-full rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700 disabled:opacity-40">ログイン</button>
        </div>

        <!-- チャット -->
        <div id="chat-panel" class="hidden space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <p class="text-sm text-slate-300">会話を始めた時点の練習データをもとに答えます。新しいゲームを反映するときは「新しい会話」を押してください。</p>
            <div class="flex gap-2">
              <button id="new-chat-btn" class="rounded-lg bg-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 disabled:opacity-40">新しい会話</button>
              <button id="logout-btn" class="rounded-lg bg-slate-600 px-3 py-2 text-sm font-semibold text-white">ログアウト</button>
            </div>
          </div>

          <div class="flex flex-wrap items-end gap-3">
            <div>
              <label for="model-select" class="mb-1 block text-xs font-semibold text-slate-300">モデル</label>
              <select id="model-select" class="select select-bordered select-sm bg-slate-100 text-slate-900"></select>
            </div>
            <p id="model-note" class="text-xs text-slate-400"></p>
          </div>

          <div id="chat-log" class="chat-log space-y-3 rounded-2xl border border-slate-700 bg-slate-900/60 p-4"></div>

          <div class="space-y-2">
            <label for="question" class="block text-xs font-semibold text-slate-300">質問</label>
            <textarea id="question" rows="3" class="chat-light-control textarea textarea-bordered w-full" placeholder="例: 最新のゲームを分析して／次のゲームで意識することは？"></textarea>
            <div class="flex flex-wrap gap-2">
              <button data-preset="最新のゲームを分析してください。" class="preset-btn rounded-full bg-slate-700 px-3 py-1 text-xs text-slate-100">最新のゲームを分析</button>
              <button data-preset="最新のゲームを、同じ狙いの1つ前のゲームと比べてください。" class="preset-btn rounded-full bg-slate-700 px-3 py-1 text-xs text-slate-100">1つ前と比較</button>
              <button data-preset="次のゲームで意識することを1つ教えてください。" class="preset-btn rounded-full bg-slate-700 px-3 py-1 text-xs text-slate-100">次に意識すること</button>
            </div>
            <button id="send-btn" class="w-full rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700 disabled:opacity-40">送信</button>
            <p class="text-xs text-slate-400">1回の質問ごとに Claude API の料金がかかります。答えの下の金額は1ドル150円で計算した目安です（Ctrl / ⌘ + Enter でも送信できます）。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://jpkycfgmgmrhuqambtxm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RmbuaFKZCRzEatZeGRWi6A_CBaaEOFB";
    const CHAT_FUNCTION = "darts-chat";
    // 会話はブラウザに保存し、ページを開き直しても続けられるようにする
    const CHAT_STORAGE_KEY = "darts.chat.conversation";
    // 新しい会話で使うモデル（次に開いたときも同じモデルにする）
    const MODEL_STORAGE_KEY = "darts.chat.model";
    // 選べるモデルと、料金の目安（100万トークンあたりのドル。2026年9月時点の公式料金）
    const MODELS = [
      { id: "claude-opus-5-5", label: "Claude Opus 5.5（標準）", note: "分析の質と料金のバランスが良い", input: 4, output: 20 },
      { id: "claude-sonnet-5-5", label: "Claude Sonnet 5.5", note: "速くて安い。普段の分析なら十分", input: 2, output: 10 },
      { id: "claude-haiku-4-5", label: "Claude Haiku 4.5", note: "一番速くて安い。簡単な質問向け", input: 1, output: 5 },
      { id: "claude-fable-5-1", label: "Claude Fable 5.1", note: "一番賢いが、料金は Opus の約2.5倍", input: 10, output: 50 }
    ];
    const DEFAULT_MODEL = "claude-opus-5-5";
    const YEN_PER_DOLLAR = 150;

    const supabaseClient = window.supabase && typeof window.supabase.createClient === "function"
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    const statusEl = document.getElementById("status");
    const loginPanel = document.getElementById("login-panel");
    const chatPanel = document.getElementById("chat-panel");
    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const newChatBtn = document.getElementById("new-chat-btn");
    const chatLogEl = document.getElementById("chat-log");
    const questionEl = document.getElementById("question");
    const sendBtn = document.getElementById("send-btn");
    const modelSelectEl = document.getElementById("model-select");
    const modelNoteEl = document.getElementById("model-note");

    // history: Claude に送る会話の履歴（サーバーから返ったものをそのまま足していく。途中は書き換えない）
    // display: 画面に表示する会話
    let conversation = loadConversation();
    let sending = false;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError
        ? "rounded-lg bg-rose-900/50 px-4 py-3 text-sm text-rose-100"
        : "rounded-lg bg-slate-900/50 px-4 py-3 text-sm text-slate-200";
    }

    function preferredModel() {
      try {
        const saved = localStorage.getItem(MODEL_STORAGE_KEY);
        return MODELS.some((model) => model.id === saved) ? saved : DEFAULT_MODEL;
      } catch (error) {
        return DEFAULT_MODEL;
      }
    }

    function modelInfo(id) {
      return MODELS.find((model) => model.id === id) || MODELS[0];
    }

    function emptyConversation() {
      return { history: [], display: [], model: preferredModel() };
    }

    function loadConversation() {
      try {
        const saved = JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || "null");
        if (!saved || !Array.isArray(saved.history) || !Array.isArray(saved.display)) return emptyConversation();
        // モデルを選べるようになる前の会話は Opus 5.5 で始めたもの
        return { ...saved, model: MODELS.some((model) => model.id === saved.model) ? saved.model : DEFAULT_MODEL };
      } catch (error) {
        return emptyConversation();
      }
    }

    function saveConversation() {
      try {
        localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(conversation));
      } catch (error) {
        // 保存できなくても、このページを開いている間は会話を続けられる
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Claude の答えは Markdown なので、HTML に変換してから安全な要素だけ残す
    function renderMarkdown(text) {
      const html = DOMPurify.sanitize(marked.parse(text));
      const container = document.createElement("div");
      container.innerHTML = html;
      // 表は横スクロールできる枠に入れる
      container.querySelectorAll("table").forEach((table) => {
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        table.replaceWith(wrap);
        wrap.appendChild(table);
      });
      return container.innerHTML;
    }

    function renderChat(pendingQuestion = null) {
      const items = conversation.display.map((item) => item.role === "user"
        ? `<div class="flex justify-end"><div class="max-w-[85%] whitespace-pre-wrap rounded-2xl bg-blue-600 px-4 py-2 text-sm text-white">${escapeHtml(item.text)}</div></div>`
        : `<div class="flex justify-start"><div class="chat-answer max-w-full rounded-2xl bg-slate-800 px-4 py-3 text-sm text-slate-100">${renderMarkdown(item.text)}${item.meta ? `<p class="mt-2 text-xs text-slate-400">${escapeHtml(item.meta)}</p>` : ""}</div></div>`);
      if (pendingQuestion !== null) {
        items.push(`<div class="flex justify-end"><div class="max-w-[85%] whitespace-pre-wrap rounded-2xl bg-blue-600 px-4 py-2 text-sm text-white">${escapeHtml(pendingQuestion)}</div></div>`);
        items.push(`<div class="flex justify-start"><div class="rounded-2xl bg-slate-800 px-4 py-3 text-sm text-slate-300">考えています...（数十秒かかることがあります）</div></div>`);
      }
      chatLogEl.innerHTML = items.length
        ? items.join("")
        : `<p class="text-sm text-slate-400">ここに会話が表示されます。下の例のボタンを押すか、質問を入力してください。</p>`;
      chatLogEl.scrollTop = chatLogEl.scrollHeight;
    }

    // 会話の途中でモデルを変えると、思考の記録やキャッシュが引き継がれないので、会話を始めたら固定する
    function renderModelSelect() {
      modelSelectEl.innerHTML = MODELS.map((model) => `<option value="${model.id}">${model.label}</option>`).join("");
      modelSelectEl.value = conversation.model;
      const started = conversation.history.length > 0;
      modelSelectEl.disabled = started || sending;
      modelNoteEl.textContent = started
        ? "この会話のモデルです。変えるときは「新しい会話」を押してください。"
        : modelInfo(conversation.model).note;
    }

    // 1回のやり取りの料金の目安（キャッシュへの書き込みは1.25倍、読み込みは0.1倍）
    function estimateYen(usage, modelId) {
      const price = modelInfo(modelId);
      const inputDollars = ((usage.input_tokens || 0) + (usage.cache_creation_input_tokens || 0) * 1.25 + (usage.cache_read_input_tokens || 0) * 0.1) * price.input / 1e6;
      const outputDollars = (usage.output_tokens || 0) * price.output / 1e6;
      return (inputDollars + outputDollars) * YEN_PER_DOLLAR;
    }

    function setSending(value) {
      sending = value;
      sendBtn.disabled = value;
      newChatBtn.disabled = value;
      sendBtn.textContent = value ? "送信中..." : "送信";
      renderModelSelect();
    }

    // Edge Function がエラーを返したときは、本文の error を取り出して表示する
    async function errorMessageOf(error) {
      try {
        const body = await error.context.json();
        if (body && body.error) return body.error;
      } catch (parseError) {
        // 本文が JSON でなければ、元のメッセージを使う
      }
      return error.message;
    }

    async function sendQuestion() {
      const question = questionEl.value.trim();
      if (!question || sending) return;

      setSending(true);
      renderChat(question);
      setStatus("Claude に質問しています...");

      const { data, error } = await supabaseClient.functions.invoke(CHAT_FUNCTION, {
        body: { history: conversation.history, question, model: conversation.model }
      });
      setSending(false);

      if (error || !data || data.error) {
        const message = error ? await errorMessageOf(error) : (data && data.error) || "答えを受け取れませんでした。";
        renderChat();
        setStatus(message, true);
        return;
      }

      conversation.history.push(data.userMessage, data.assistantMessage);
      const usage = data.usage || {};
      // 入力はキャッシュに書き込んだ分・読み込んだ分も合わせた合計を出す
      const inputTotal = (usage.input_tokens || 0) + (usage.cache_creation_input_tokens || 0) + (usage.cache_read_input_tokens || 0);
      const servedModel = modelInfo(conversation.model);
      const meta = `${servedModel.label.replace("（標準）", "")}・入力 ${inputTotal}（うちキャッシュ読み込み ${usage.cache_read_input_tokens || 0}）／出力 ${usage.output_tokens ?? "-"} トークン・約${estimateYen(usage, conversation.model).toFixed(1)}円${data.truncated ? "・答えが長すぎて途中で切れました" : ""}`;
      conversation.display.push({ role: "user", text: question }, { role: "assistant", text: data.text, meta });
      saveConversation();
      questionEl.value = "";
      renderChat();
      renderModelSelect();
      setStatus("答えを受け取りました。");
    }

    async function showForSession(session) {
      const loggedIn = Boolean(session);
      loginPanel.classList.toggle("hidden", loggedIn);
      chatPanel.classList.toggle("hidden", !loggedIn);
      if (loggedIn) {
        renderChat();
        renderModelSelect();
        setStatus(`${session.user.email} でログインしています。`);
      } else {
        setStatus("ログインしてください。");
      }
    }

    loginBtn.addEventListener("click", async () => {
      loginBtn.disabled = true;
      setStatus("ログインしています...");
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: emailEl.value.trim(),
        password: passwordEl.value
      });
      loginBtn.disabled = false;
      passwordEl.value = "";
      if (error) {
        setStatus(`ログインできませんでした: ${error.message}`, true);
        return;
      }
      await showForSession(data.session);
    });

    logoutBtn.addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      await showForSession(null);
    });

    newChatBtn.addEventListener("click", () => {
      if (conversation.display.length && !confirm("今の会話を消して、新しい会話を始めますか？")) return;
      conversation = emptyConversation();
      saveConversation();
      renderChat();
      renderModelSelect();
      setStatus("新しい会話を始めます。最初の質問のときに、最新の練習データを読み込みます。");
    });

    modelSelectEl.addEventListener("change", () => {
      conversation.model = modelSelectEl.value;
      try {
        localStorage.setItem(MODEL_STORAGE_KEY, conversation.model);
      } catch (error) {
        // 保存できなくても、この会話ではこのモデルを使う
      }
      saveConversation();
      renderModelSelect();
    });

    sendBtn.addEventListener("click", sendQuestion);
    questionEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        sendQuestion();
      }
    });
    document.querySelectorAll(".preset-btn").forEach((button) => {
      button.addEventListener("click", () => {
        questionEl.value = button.dataset.preset;
        questionEl.focus();
      });
    });

    (async () => {
      if (!supabaseClient) {
        setStatus("Supabaseクライアントを初期化できませんでした。", true);
        return;
      }
      const { data } = await supabaseClient.auth.getSession();
      await showForSession(data.session);
    })();
  </script>
</body>

</html>
