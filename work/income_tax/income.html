<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>所得税計算</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen p-6">

  <div class="max-w-2xl mx-auto">

    <!-- ヘッダー -->
    <div class="flex items-center mb-8">

      <!-- タイトル（左） -->
      <h1 class="text-3xl font-bold text-gray-800">
        所得税 計算
      </h1>

      <!-- 戻る（右寄せ） -->
      <a href="../../index.html"
        class="ml-auto bg-white shadow px-4 py-2 rounded-lg hover:bg-gray-100">
        ← 戻る
      </a>

    </div>

    <!-- カード -->
    <div class="bg-white rounded-2xl shadow-lg p-8 space-y-6">
      <!-- 入力 -->
      <div>
        <label class="block text-lg font-semibold mb-2 text-gray-700">
          年収（万円）
        </label>
        <input type="number" id="input_income"
               class="w-full text-xl p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
               placeholder="例：500">
      </div>

      <!-- ボタン -->
      <button id="run"
              onclick="main()"
              disabled
              class="w-full bg-blue-500 text-white py-3 rounded-lg text-lg font-semibold hover:bg-blue-600 transition disabled:bg-gray-400">
        計算する
      </button>

      <!-- 出力 -->
      <!-- <pre id="output"
           class="hidden bg-gray-100 p-4 rounded-lg border text-sm whitespace-pre-wrap">
      </pre> -->
      <div id="output"
        class="hidden bg-gray-50 p-6 rounded-xl border space-y-4">
      </div>

    </div>
  </div>

  <script>
    let pyodide;

    async function loadPyodideAndPackages() {
      pyodide = await loadPyodide();
      await pyodide.loadPackage(["matplotlib", "numpy"]);
      document.getElementById("run").disabled = false;
    }

    async function main() {
      const output = document.getElementById("output");
      output.innerText = "";
      output.classList.add("hidden");

      while (!pyodide) {
        await new Promise(resolve => setTimeout(resolve, 100));
      }

      let result = "";

      let input_income = parseFloat(document.getElementById("input_income").value);

      try {
        const res = await fetch("py_program.py");
        let code;
        if (res.ok) {
          code = "input_income = " + input_income + "\n" +
                 await res.text();
        } else {
          code = "print('Error: ファイルを読み込めません')";
        }

        pyodide.setStdout({
          batched: (msg) => { result += msg + "\n"; }
        });

        await pyodide.runPythonAsync(code);

      } catch (error) {
        result = "エラー: " + error;
      }

      // output.innerText = result;

      // if (result.trim() !== "") {
      //   output.classList.remove("hidden");
      // }

        if (result.trim() === "") return;

      // 行ごとに分割
      const lines = result.trim().split("\n");

      let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;

      lines.forEach(line => {
        if (!line.includes(":")) return;

        const [label, value] = line.split(":");

        html += `
          <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="text-gray-500">${label}</div>
            <div class="text-2xl font-bold text-blue-600">
              ${value}
            </div>
          </div>
        `;
      });

      html += `</div>`;

      output.innerHTML = html;
      output.classList.remove("hidden");
    }

    loadPyodideAndPackages();
  </script>

</body>
</html>
