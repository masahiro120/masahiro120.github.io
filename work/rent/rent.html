<!DOCTYPE html>
<html lang="ja" data-theme="night">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" href="/icon.png">
	<title>家賃</title>

	<script src="https://cdn.tailwindcss.com"></script>

	<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />

	<link rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<link rel="stylesheet" href="/css/site.css">
</head>

<body class="page-shell">

	<div class="main-container">
		<div class="page-card">
			<div class="card-body">

				<div class="section-title">
					<h1 class="hero-title" style="font-size: 2.5rem;">家賃</h1>
					<a href="/index.html" class="back-button">← 戻る</a>
				</div>

				<div class="space-y-6">


			<!-- ラジオ -->
			<div class="flex flex-col md:flex-row gap-3 text-sm md:text-base">
				<label><input type="radio" name="mode" value="rent_to_income" checked> 家賃→手取り</label>
				<label><input type="radio" name="mode" value="income_to_rent"> 手取り→家賃</label>
				<label><input type="radio" name="mode" value="income_to_ratio"> 手取り→割合</label>
			</div>

			<!-- 入力 -->
			<div class="space-y-4">

				<div id="rent-group">
					<label class="block text-lg font-semibold mb-2 text-gray-700">家賃（万円）</label>
					<input id="rent" type="number" class="w-full p-3 border rounded-lg">
				</div>

				<div id="income-group">
					<label class="block text-lg font-semibold mb-2 text-gray-700">手取り（万円）</label>
					<input id="income" type="number" class="w-full p-3 border rounded-lg">
				</div>

				<div id="ratio-group">
					<label class="block text-lg font-semibold mb-2 text-gray-700">割合（例: 0.3）</label>
					<input id="ratio" type="number" class="w-full p-3 border rounded-lg">
				</div>

				<div id="subsidy-group">
					<label class="block text-lg font-semibold mb-2 text-gray-700">家賃補助（万円）</label>
					<input id="subsidy" type="number" class="w-full p-3 border rounded-lg">
				</div>

				<div id="tax-group">
					<label class="block text-lg font-semibold mb-2 text-gray-700">補助にかかる税金（万円）</label>
					<input id="tax" type="number" class="w-full p-3 border rounded-lg">
				</div>

			</div>

			<!-- ボタン -->
			<button onclick="main()" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600">
				計算
			</button>

				<!-- 出力 -->
				<div id="output" class="hidden bg-gray-50 p-6 rounded-xl border space-y-4"></div>
			</div>
			</div>
		</div>
	</div>

	<script type="module">
		import {
			formatNumber
		} from "/module.js";

		import {
			calcRentToIncome,
			calcIncomeToRent,
			calcIncomeToRatio
		} from "./module.js";

		window.main = function () {
			const output = document.getElementById("output");
			output.classList.remove("hidden");

			const mode = document.querySelector('input[name="mode"]:checked').value;

			let rent = document.getElementById("rent").value;
			let income = document.getElementById("income").value;
			let ratio = document.getElementById("ratio").value;
			let subsidy = document.getElementById("subsidy").value;
			let tax = document.getElementById("tax").value;

			// =========================
			// 入力チェック（ここ重要）
			// =========================
			function isInvalid(v) {
				return v === "" || isNaN(Number(v));
			}

			if (
				(mode === "rent_to_income" && (isInvalid(rent) || isInvalid(ratio))) ||
				(mode === "income_to_rent" && (isInvalid(income) || isInvalid(ratio))) ||
				(mode === "income_to_ratio" && (isInvalid(income) || isInvalid(rent)))
			) {
				output.innerHTML = `
				<div class="text-red-500 text-center font-bold">入力を確認してください</div>
				`;
				return;
			}

			// 数値化（ここで安全に変換）
			rent = Number(rent);
			income = Number(income);
			ratio = Number(ratio);
			subsidy = Number(subsidy || 0);
			tax = Number(tax || 0);

			let html = "";

			try {

				// let realCost, needIncome, rentCalc, ratioCalc;

				let result;

				if (mode === "rent_to_income") {
					result = calcRentToIncome(rent, ratio, subsidy, tax);
					html = `
						<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
					        <div class="bg-white p-4 rounded-lg shadow text-center">
								<div class="text-gray-500">実質負担額</div>
								<div class="text-2xl font-bold text-blue-600">
									${formatNumber(result.realCost)} 万円
								</div>
							</div>

							<div class="bg-white p-4 rounded-lg shadow text-center">
								<div class="text-gray-500">必要手取り</div>
								<div class="text-2xl font-bold text-green-600">
									${formatNumber(result.needIncome)} 万円
								</div>
							</div>
						</div>
					`;
				}

				else if (mode === "income_to_rent") {
					result = calcIncomeToRent(income, ratio, subsidy, tax);
					html = `
						<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
							<div class="bg-white p-4 rounded-lg shadow text-center">
								<div class="text-gray-500">実質負担額</div>
								<div class="text-2xl font-bold text-blue-600">
									${formatNumber(result.realCost)} 万円
								</div>
							</div>

							<div class="bg-white p-4 rounded-lg shadow text-center">
								<div class="text-gray-500">家賃目安</div>
								<div class="text-2xl font-bold text-green-600">
									${formatNumber(result.rent)} 万円
								</div>
							</div>
						</div>
					`;
				}

				else {
					result = calcIncomeToRatio(rent, income, subsidy, tax);
					html = `
						<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
							<div class="bg-white p-4 rounded-lg shadow text-center">
								<div class="text-gray-500">実質負担額</div>
								<div class="text-2xl font-bold text-blue-600">
									${formatNumber(result.realCost)} 万円
								</div>
							</div>

							<div class="bg-white p-4 rounded-lg shadow text-center">
								<div class="text-gray-500">割合</div>
								<div class="text-2xl font-bold text-green-600">
									${formatNumber(result.ratio * 100)} %
								</div>
							</div>
						</div>
					`;
				}
			} catch (e) {
				html = `<div class="text-red-500 text-center">入力を確認してください</div>`;
			}

			output.innerHTML = html;
		}

		const groups = {
			rent: document.getElementById("rent-group"),
			income: document.getElementById("income-group"),
			ratio: document.getElementById("ratio-group"),
			subsidy: document.getElementById("subsidy-group"),
			tax: document.getElementById("tax-group"),
		};

		function updateForm() {
			const mode = document.querySelector('input[name="mode"]:checked').value;

			// 全部非表示にする
			Object.values(groups).forEach(el => el.classList.add("hidden"));

			if (mode === "rent_to_income") {
				groups.rent.classList.remove("hidden");
				groups.ratio.classList.remove("hidden");
				groups.subsidy.classList.remove("hidden");
				groups.tax.classList.remove("hidden");
			}

			else if (mode === "income_to_rent") {
				groups.income.classList.remove("hidden");
				groups.ratio.classList.remove("hidden");
				groups.subsidy.classList.remove("hidden");
				groups.tax.classList.remove("hidden");
			}

			else {
				groups.income.classList.remove("hidden");
				groups.rent.classList.remove("hidden");
				groups.subsidy.classList.remove("hidden");
				groups.tax.classList.remove("hidden");
			}
		}

		// 初期表示
		updateForm();

		// ラジオ変更時
		document.querySelectorAll('input[name="mode"]').forEach(radio => {
			radio.addEventListener("change", updateForm);
		});

		document.querySelectorAll("input").forEach(el => {
			el.addEventListener("change", () => {
				el.blur();
			});

			el.addEventListener("keydown", (e) => {
				if (e.key === "Enter") el.blur();
			});
		});

		document.addEventListener("pointerdown", (e) => {
			if (!e.target.closest("input")) {
				document.activeElement?.blur();
			}
		});
	</script>

</body>

</html>
